name: LSPFRIDA Release APK
on:
  push:
    branches: [build/lspfrida-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.1' 'cmake;3.22.1' 'ndk;28.2.13676358'
      - name: Prepare GumJS
        run: |
          devkit=app/src/main/cpp/frida-gumjs-devkit/arm64-v8a
          mkdir -p "$devkit"
          curl -fL --retry 3 -o "$RUNNER_TEMP/gumjs.tar.xz" https://github.com/frida/frida/releases/download/17.9.3/frida-gumjs-devkit-17.9.3-android-arm64.tar.xz
          tar -xJf "$RUNNER_TEMP/gumjs.tar.xz" -C "$devkit"
          test -s "$devkit/libfrida-gumjs.a"
      - name: Assemble Release
        run: bash gradlew --no-daemon :app:assembleRelease
      - name: Sign and verify Release
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.1"
          export LSPFRIDA_SIGN_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/lspfrida-release.p12" -storetype PKCS12 -storepass:env LSPFRIDA_SIGN_PASSWORD -alias release -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=LSPFRIDA Release'
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/lspfrida-release.p12" --ks-pass env:LSPFRIDA_SIGN_PASSWORD --ks-key-alias release --out LSPFRIDA-release-arm64-v8a.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose LSPFRIDA-release-arm64-v8a.apk
          "$tools/aapt" dump badging LSPFRIDA-release-arm64-v8a.apk > "$RUNNER_TEMP/badging.txt"
          grep '^native-code:.*arm64-v8a' "$RUNNER_TEMP/badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/badging.txt"; then exit 1; fi
          sha256sum LSPFRIDA-release-arm64-v8a.apk
      - uses: actions/upload-artifact@v7
        with:
          name: LSPFRIDA-release-arm64-v8a
          path: LSPFRIDA-release-arm64-v8a.apk
          if-no-files-found: error
